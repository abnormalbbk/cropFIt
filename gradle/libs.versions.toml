firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebaseMLInterpreter = { group = "com.google.firebase", name = "firebase-ml-model-interpreter", version.ref = "firebaseMLInterpreter" }
firebaseMLModelDwonloader = { group = "com.google.firebase", name = "firebase-ml-modeldownloader", version.ref = "firebaseMLModelDwonloader" }

tensoflowLite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }
tensorflowLiteTaskVision = { group = "org.tensorflow", name = "tensorflow-lite-task-vision", version.ref = "tensorflowLiteGPU" }
tensorflowLiteGPU = { group = "org.tensorflow", name = "tensorflow-lite-gpu", version.ref = "tensorflowLiteGPU" }

google-signin = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "location" }
permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "permissions" }

coil = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
