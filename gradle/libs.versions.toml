coilSvg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil" }

lottie = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }

datastorePreferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

googleMaps = { group = "com.google.maps.android", name = "maps-compose", version.ref = "googleMaps" }
playServicesMaps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }

kotlinxSerialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerilization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
